<section class="edition-page">
  <div class="edition-hero">
    <span>{{ period }}</span>
    <h2>{{ title }}</h2>
    <p>{{ intro }}</p>
  </div>

  <div class="edition-grid">
    @for (card of cards; track card.title) {
      <article class="edition-card">
        <h3>{{ card.title }}</h3>

        <ul>
          @for (item of card.items; track item) {
            <li>{{ item }}</li>
          }
        </ul>
      </article>
    }
  </div>
</section>
