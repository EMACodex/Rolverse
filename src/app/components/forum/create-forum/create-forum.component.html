<div class="create-container">
  <h2 class="title">Crear nuevo foro</h2>

  <form [formGroup]="forumForm" (ngSubmit)="onSubmit()" class="register-form">
    <div class="form-group">
      <label for="title" class="label">Titulo</label>
      <div class="input-icon-container">
        <input
          id="title"
          formControlName="title"
          class="input-field"
          placeholder="Titulo del foro"
        />
        <i class="fas fa-heading input-icon"></i>
      </div>
      @if (title?.invalid && title?.touched) {
        <div class="error">El titulo es obligatorio</div>
      }

      <label for="description" class="label">Descripcion</label>
      <div class="input-icon-container">
        <textarea
          id="description"
          formControlName="description"
          class="input-field"
          placeholder="Descripcion del foro"
        ></textarea>
        <i class="fas fa-align-left input-icon"></i>
      </div>
      @if (description?.invalid && description?.touched) {
        <div class="error">La descripcion es obligatoria</div>
      }

      <label for="visibility" class="label">Tipo de sala</label>
      <select id="visibility" formControlName="visibility" class="input-field select-field">
        <option value="public">Sala publica</option>
        <option value="private">Sala privada</option>
      </select>
      @if (visibility?.invalid && visibility?.touched) {
        <div class="error">Selecciona el tipo de sala</div>
      }

      @if (errorMessage) {
        <div class="error">{{ errorMessage }}</div>
      }

      <button type="submit" [disabled]="forumForm.invalid" class="btn-submit">
        Crear foro
      </button>
    </div>
  </form>
</div>
