<!-- Vista d20 revised de Rolverse. Estructura seccionada sin alterar rutas ni permisos. -->
<section class="edition-page">
  <div class="edition-hero">
    <span>{{ period }}</span>
    <h2>{{ title | translate }}</h2>
    <p>{{ intro | translate }}</p>
  </div>

  <div class="edition-grid">
    @for (card of cards; track card.title) {
      <article class="edition-card">
        <h3>{{ card.title | translate }}</h3>

        <ul>
          @for (item of card.items; track item) {
            <li>{{ item | translate }}</li>
          }
        </ul>
      </article>
    }
  </div>
</section>
