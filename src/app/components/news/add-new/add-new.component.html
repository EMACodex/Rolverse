<div class="page-background">
  <div class="news-form-container">
    <h2>{{ isEditMode ? ("NEWS.EDIT_TITLE" | translate) : ("NEWS.ADD_TITLE" | translate) }}</h2>

    <form [formGroup]="newsForm" (ngSubmit)="onSubmit()" class="news-form">
      <label for="title">{{ "NEWS.TITLE_FIELD" | translate }} *</label>
      <input id="title" type="text" formControlName="title" required />

      <label for="summary">{{ "NEWS.SUMMARY" | translate }}</label>
      <input id="summary" type="text" formControlName="summary" />

      <label>{{ "NEWS.CREATED_AT" | translate }}</label>
      <input type="text" [value]="fechaActual" disabled />

      <label for="image">{{ "NEWS.IMAGE" | translate }}</label>
      <input id="image" type="file" accept="image/*" (change)="onImageSelected($event)" />

      @if (imagePreview) {
        <div class="image-preview">
          <img [src]="imagePreview" alt="Vista previa de imagen" />
        </div>
      }

      <label for="content">{{ "NEWS.DESCRIPTION" | translate }} *</label>
      <textarea
        id="content"
        rows="8"
        formControlName="content"
        required
      ></textarea>

      <button class="rpg-login-button" type="submit">
        {{ isEditMode ? ("NEWS.SAVE" | translate) : ("NEWS.PUBLISH" | translate) }}
      </button>
    </form>

    @if (errorMessage) {
      <div class="modal-backdrop">
        <div class="modal-window">
          <p>{{ errorMessage }}</p>
          <button class="rpg-login-button" type="button" (click)="closeError()">
            {{ "NEWS.CLOSE" | translate }}
          </button>
        </div>
      </div>
    }
  </div>
</div>
