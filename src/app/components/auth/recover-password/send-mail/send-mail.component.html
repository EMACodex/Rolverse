<!-- Vista send mail de Rolverse. Estructura seccionada sin alterar rutas ni permisos. -->
<div class="send-mail-wrapper">
  <div class="send-mail-container">
    <h2 class="send-mail-title">{{ "AUTH.RECOVER_TITLE" | translate }}</h2>

    <form [formGroup]="formGroup" class="send-mail-form">
      <div class="send-mail-group">
        <label for="email" class="send-mail-label">{{ "AUTH.EMAIL" | translate }}</label>

        <div class="send-mail-input-wrapper">
          <input
            id="email"
            type="email"
            formControlName="email"
            class="send-mail-input"
          />
          <i class="fas fa-envelope input-icon"></i>
        </div>

        @if (formGroup.get('email')?.invalid && formGroup.get('email')?.touched) {
          <div class="send-mail-error">
            El email es obligatorio y debe ser válido.
          </div>
        }

        @if (feedbackMessage) {
          <div
            class="send-mail-feedback"
            [class.success]="isSuccess"
            [class.error]="!isSuccess"
          >
            {{ feedbackMessage }}
          </div>
        }

        <button
          type="button"
          class="send-mail-button"
          [disabled]="isSubmitting"
          (click)="enviarRecuperacion()"
        >
          @if (isSubmitting) {
            {{ "AUTH.SENDING" | translate }}
          } @else {
            {{ "AUTH.SEND_NEW_PASSWORD" | translate }}
          }
        </button>

        <a class="back-home-button" [routerLink]="['/']">
          {{ "AUTH.BACK_HOME" | translate }}
        </a>
      </div>
    </form>
  </div>
</div>
